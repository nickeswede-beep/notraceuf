<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Telefon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- Telefonen ---------- */
  #stage { height: 100%; display: flex; align-items: center; justify-content: center; }
  #phone {
    position: relative; overflow: hidden;
    width: 100vw; height: 100vh; height: 100dvh;
    background: #000; color: #000;
    --u: 1vw;               /* 1 % av telefonens bredd */
  }
  @media (min-width: 520px) {
    body { background: #16161a; }
    #phone {
      width: 390px; height: 844px; --u: 3.9px;
      border-radius: 54px;
      box-shadow: 0 0 0 11px #0b0b0d, 0 0 0 13px #3a3a40, 0 30px 80px rgba(0,0,0,.6);
      transform-origin: center center;
    }
  }

  /* ---------- Statusrad ---------- */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    height: 50px; padding: 16px 30px 0 34px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 16px; letter-spacing: -.2px;
    color: #fff; pointer-events: none; transition: color .25s;
  }
  #phone.light .statusbar { color: #000; }
  .statusbar .right { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { display: block; fill: currentColor; }

  /* ---------- Hemskärm ---------- */
  #home {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 85% 8%, rgba(214,120,92,.55), transparent 60%),
      radial-gradient(90% 60% at 10% 35%, rgba(60,110,170,.55), transparent 65%),
      radial-gradient(120% 80% at 50% 110%, rgba(18,60,70,.9), transparent 60%),
      linear-gradient(160deg, #1b2440 0%, #23203f 45%, #0d1a26 100%);
    transition: transform .3s ease, filter .3s ease;
  }
  #phone.in-app #home { transform: scale(.94); filter: brightness(.6); }
  .grid {
    position: absolute; top: 76px; left: 0; right: 0;
    padding: 0 calc(var(--u) * 6.4);
    display: grid; grid-template-columns: repeat(4, 1fr);
    row-gap: 22px;
  }
  .app-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon {
    width: calc(var(--u) * 15.6); height: calc(var(--u) * 15.6);
    border-radius: 23%; overflow: hidden; display: block;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    transition: transform .12s, filter .12s;
  }
  .icon svg { width: 100%; height: 100%; display: block; }
  .app-btn:active .icon { transform: scale(.92); filter: brightness(.8); }
  .app-btn .label { color: #fff; font-size: 12px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .dock {
    position: absolute; left: calc(var(--u) * 3.4); right: calc(var(--u) * 3.4); bottom: 26px;
    padding: calc(var(--u) * 3.6) calc(var(--u) * 3);
    border-radius: calc(var(--u) * 9);
    background: rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    display: flex; justify-content: center; gap: calc(var(--u) * 9);
  }
  .dock .label { display: none; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px) rotate(-3deg); }
    40% { transform: translateX(6px) rotate(3deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(3px) rotate(1deg); }
  }
  .app-btn.shake .icon { animation: shake .38s ease; }

  /* ---------- Appar (gemensamt) ---------- */
  .app {
    position: absolute; inset: 0; z-index: 10;
    background: #fff; color: #000;
    display: flex; flex-direction: column;
    opacity: 0; transform: scale(.82); pointer-events: none;
    transition: opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .app.open { opacity: 1; transform: none; pointer-events: auto; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: inherit; }
  .view.sub { transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .view.sub.show { transform: none; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 40px; }
  .top { padding-top: 54px; }
  h1.large { margin: 0; padding: 6px 18px 8px; font-size: 33px; font-weight: 700; letter-spacing: -.4px; }
  .muted { color: #8a8a8e; }

  /* ---------- Meddelanden ---------- */
  .thread {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    padding: 9px 0 9px 18px;
  }
  .thread:active { background: #e9e9ee; }
  .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(#a5abb8, #848a96); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500;
  }
  .thread .body { flex: 1; min-width: 0; padding: 2px 16px 10px 0; border-bottom: 1px solid #e3e3e7; }
  .thread .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .thread .name { font-size: 17px; font-weight: 600; }
  .thread .when { font-size: 15px; color: #8a8a8e; white-space: nowrap; }
  .thread .preview { font-size: 15px; color: #8a8a8e; line-height: 1.3; height: 2.6em; overflow: hidden; }

  .chat-head {
    flex: none; padding: 50px 8px 8px; background: rgba(248,248,250,.94);
    border-bottom: 1px solid #dcdce0; text-align: center; position: relative;
  }
  .back {
    position: absolute; left: 4px; top: 52px; padding: 8px 12px; color: #0a7cff;
    display: flex; align-items: center; gap: 3px; font-size: 17px;
  }
  .back svg { width: 12px; height: 20px; }
  .chat-head .avatar { margin: 0 auto 3px; width: 44px; height: 44px; font-size: 19px; }
  .chat-head .who { font-size: 12px; }
  .chat { padding: 10px 12px 20px; display: flex; flex-direction: column; }
  .day { align-self: center; font-size: 12px; color: #8a8a8e; margin: 14px 0 8px; font-weight: 500; }
  .msg { max-width: 76%; margin-top: 3px; display: flex; flex-direction: column; }
  .msg .bubble {
    padding: 8px 13px; border-radius: 19px; font-size: 16.5px; line-height: 1.28;
    -webkit-user-select: text; user-select: text;
  }
  .msg .time { font-size: 11px; color: #8a8a8e; margin: 2px 6px 5px; }
  .msg.in { align-self: flex-start; }
  .msg.in .bubble { background: #e9e9eb; color: #000; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .msg.out .bubble { background: #34b556; color: #fff; }
  .composer {
    flex: none; padding: 8px 12px 30px; background: #fff; display: flex; gap: 10px; align-items: center;
  }
  .composer .field { flex: 1; border: 1px solid #d0d0d5; border-radius: 18px; padding: 7px 14px; color: #b4b4b9; font-size: 16px; }
  .composer .plus { width: 32px; height: 32px; border-radius: 50%; background: #e9e9eb; color: #7c7c82; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }

  /* ---------- Telefon ---------- */
  .call { display: flex; align-items: center; padding-left: 18px; }
  .call .inner { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 16px 9px 0; border-bottom: 1px solid #e3e3e7; }
  .call .name { font-size: 17px; font-weight: 600; }
  .call.missed .name { color: #e5372b; }
  .call .sub { font-size: 14px; color: #8a8a8e; margin-top: 1px; }
  .call .when { text-align: right; font-size: 15px; color: #8a8a8e; white-space: nowrap; line-height: 1.3; }
  .tabbar {
    flex: none; display: flex; justify-content: space-around; padding: 7px 4px 30px;
    background: rgba(248,248,250,.96); border-top: 1px solid #dcdce0;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #9a9aa0; width: 20%; }
  .tab svg { width: 25px; height: 25px; fill: currentColor; }
  .tab.on { color: #0a7cff; }

  /* ---------- Kalender ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 4px 18px; }
  .cal-head h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.4px; text-transform: capitalize; }
  .cal-head h1 span { color: #e5372b; font-weight: 400; margin-left: 6px; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { width: 40px; height: 40px; color: #e5372b; display: flex; align-items: center; justify-content: center; }
  .cal-nav svg { width: 11px; height: 19px; }
  .dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 0 8px; }
  .dow { font-size: 11px; color: #8a8a8e; font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid #e3e3e7; }
  .dow .we { color: #b8b8bd; }
  .daycell { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; gap: 2px; }
  .daycell .num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .daycell.we .num { color: #8a8a8e; }
  .daycell.today .num { background: #e5372b; color: #fff; font-weight: 600; }
  .daycell.sel:not(.today) .num { background: #1c1c1e; color: #fff; font-weight: 600; }
  .daycell .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .daycell.has .dot { background: #b0b0b6; }
  .events { border-top: 1px solid #e3e3e7; margin-top: 4px; }
  .events h2 { margin: 0; padding: 12px 18px 6px; font-size: 13px; font-weight: 600; color: #8a8a8e; text-transform: uppercase; letter-spacing: .3px; }
  .event { display: flex; gap: 12px; padding: 0 18px; align-items: stretch; transition: background .2s; }
  .event.hl { background: #fdeceb; }
  .event .date { flex: none; width: 58px; padding: 11px 0; font-size: 15px; color: #8a8a8e; }
  .event .what { flex: 1; padding: 11px 0 11px 10px; font-size: 16.5px; font-weight: 500; border-left: 3px solid #e5372b; border-bottom: 1px solid #efeff2; }
  .event .what small { display: block; font-weight: 400; font-size: 13px; color: #8a8a8e; margin-top: 1px; }
  .noevents { padding: 14px 18px; color: #8a8a8e; font-size: 15px; }

  /* ---------- Hemstreck och tips ---------- */
  #homebar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 60;
    display: none; align-items: flex-end; justify-content: center; padding-bottom: 8px;
  }
  #phone.in-app #homebar { display: flex; }
  #homebar i { width: 36%; height: 5px; border-radius: 3px; background: #000; opacity: .85; }
  #hint {
    position: absolute; left: 50%; bottom: 44px; z-index: 70; transform: translate(-50%, 10px);
    background: rgba(28,28,30,.9); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 16px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  }
  #hint.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="stage">
<div id="phone">

  <div class="statusbar">
    <span id="clock"></span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>

  <button id="homebar" aria-label="Hem"><i></i></button>
  <div id="hint">Tryck på strecket för att gå till hemskärmen</div>

</div>

<script>

};

// open: vilken app som öppnas. Saknas open går appen inte att öppna (ikonen skakar).
const HOME_APPS = [
  { icon: "social",   label: "Socialt" },
  { icon: "notes",    label: "Anteckningar" },
  { icon: "photos",   label: "Bilder" },
  { icon: "calendar", label: "Kalender", open: "calendar" },
  { icon: "mail",     label: "Mejl" },
  { icon: "weather",  label: "Väder" },
  { icon: "maps",     label: "Kartor" }
];
const DOCK_APPS = [
  { icon: "phone",    label: "Telefon",     open: "phone" },
  { icon: "messages", label: "Meddelanden", open: "messages" }
];

/* =====================================================================
   Logik
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const phone = $("#phone");
let hintShown = false;

$("#clock").textContent = NOW.time;

// Skala telefonramen på stora skärmar
function fit() {
  if (window.innerWidth >= 520) {
    const s = Math.min(1, (window.innerHeight - 48) / 844, (window.innerWidth - 48) / 390);
    phone.style.transform = `scale(${s})`;
  } else phone.style.transform = "";
}
addEventListener("resize", fit); fit();

// ---- Hemskärm ----
function addApps(target, list) {
  list.forEach(a => {
    const b = el("button", "app-btn", `<span class="icon">${ICONS[a.icon]}</span><span class="label">${a.label}</span>`);
    b.setAttribute("aria-label", a.label);
    b.addEventListener("click", () => {
      if (a.open) return openApp(a.open);
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    });
    target.appendChild(b);
  });
}
addApps($("#grid"), HOME_APPS);
addApps($("#dock"), DOCK_APPS);

function openApp(id) {
  document.querySelectorAll(".app").forEach(a => a.classList.remove("open"));
  document.querySelectorAll(".view.sub").forEach(v => v.classList.remove("show"));
  $("#app-" + id).classList.add("open");
  phone.classList.add("in-app", "light");
  if (id === "calendar") renderCalendar(NOW.year, NOW.month, NOW.day);
  if (!hintShown) {
    hintShown = true;
    setTimeout(() => $("#hint").classList.add("show"), 500);
    setTimeout(() => $("#hint").classList.remove("show"), 4200);
  }
}
function goHome() {
  document.querySelectorAll(".app").forEach(a => a.classList.remove("open"));
  phone.classList.remove("in-app", "light");
  $("#hint").classList.remove("show");
}
$("#homebar").addEventListener("click", goHome);
// Svep uppåt från nederkanten går också hem
let swipeY = null;
phone.addEventListener("touchstart", e => {
  const r = phone.getBoundingClientRect(), t = e.touches[0];
  swipeY = (r.bottom - t.clientY < 44) ? t.clientY : null;
}, { passive: true });
phone.addEventListener("touchend", e => {
  if (swipeY != null && swipeY - e.changedTouches[0].clientY > 40) goHome();
  swipeY = null;
}, { passive: true });
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => b.closest(".view").classList.remove("show")));

// ---- Meddelanden ----
THREADS.forEach(t => {
  const last = t.days[t.days.length - 1].msgs.slice(-1)[0];
  const b = el("button", "thread",
    `<span class="avatar">${t.name[0]}</span>
     <span class="body"><span class="row"><span class="name">${esc(t.name)}</span><span class="when">${t.listWhen} ›</span></span>
     <span class="preview">${esc(last.text)}</span></span>`);
  b.addEventListener("click", () => openThread(t));
  $("#threads").appendChild(b);
});
function openThread(t) {
  $("#chat-avatar").textContent = t.name[0];
  $("#chat-name").textContent = t.name;
  const chat = $("#chat"); chat.innerHTML = "";
  t.days.forEach(d => {
    chat.appendChild(el("div", "day", d.date));
    d.msgs.forEach(m => {
      chat.appendChild(el("div", "msg " + (m.from === "V" ? "out" : "in"),
        `<div class="bubble">${esc(m.text)}</div><div class="time">${m.time}</div>`));
    });
  });
  $("#chatview").classList.add("show");
  const sc = chat.parentElement; requestAnimationFrame(() => sc.scrollTop = sc.scrollHeight);
}

// ---- Telefon ----
CALLS.forEach(c => {
  const missed = !c.length;
  const sub = missed ? "Missat samtal" + (c.count > 1 ? " ×" + c.count : "") : "Samtalslängd " + c.length;
  $("#calls").appendChild(el("div", "call" + (missed ? " missed" : ""),
    `<div class="inner"><div><div class="name">${esc(c.name)}</div><div class="sub">${sub}</div></div>
     <div class="when">${c.date}<br>kl. ${c.time}</div></div>`));
});

// ---- Kalender ----
const MONTHS = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const WD = ["sön","mån","tis","ons","tors","fre","lör"];
const pad = n => String(n).padStart(2, "0");
let cal = { y: NOW.year, m: NOW.month };
function renderCalendar(y, m, sel) {
  cal = { y, m };
  $("#cal-title").innerHTML = `${MONTHS[m - 1]}<span>${y}</span>`;
  const days = $("#cal-days"); days.innerHTML = "";
  const first = (new Date(y, m - 1, 1).getDay() + 6) % 7;      // måndag först
  const count = new Date(y, m, 0).getDate();
  for (let i = 0; i < first; i++) days.appendChild(el("div", "daycell"));
  for (let d = 1; d <= count; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`, wd = new Date(y, m - 1, d).getDay();
    const c = el("button", "daycell", `<span class="num">${d}</span><span class="dot"></span>`);
    if (wd === 0 || wd === 6) c.classList.add("we");
    if (EVENTS[key]) c.classList.add("has");
    if (y === NOW.year && m === NOW.month && d === NOW.day) c.classList.add("today");
    if (d === sel) c.classList.add("sel");
    c.addEventListener("click", () => renderCalendar(y, m, d));
    days.appendChild(c);
  }
  const box = $("#cal-events"); box.innerHTML = "";
  box.appendChild(el("h2", "", `Händelser i ${MONTHS[m - 1]}`));
  let any = false, target = null;
  for (let d = 1; d <= count; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`;
    (EVENTS[key] || []).forEach(title => {
      any = true;
      const row = el("div", "event" + (d === sel ? " hl" : ""),
        `<div class="date">${WD[new Date(y, m - 1, d).getDay()]} ${d}</div><div class="what">${esc(title)}<small>Heldag</small></div>`);
      if (d === sel) target = row;
      box.appendChild(row);
    });
  }
  if (!any) box.appendChild(el("div", "noevents", "Inga händelser"));
  if (target && target.scrollIntoView) target.scrollIntoView({ block: "nearest" });
}
$("#cal-prev").addEventListener("click", () => { let { y, m } = cal; m--; if (m < 1) { m = 12; y--; } renderCalendar(y, m, null); });
$("#cal-next").addEventListener("click", () => { let { y, m } = cal; m++; if (m > 12) { m = 1; y++; } renderCalendar(y, m, null); });
</script>
