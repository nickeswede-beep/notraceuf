<title>Telefon</title>

<script>
/* =====================================================================
   SPELETS INNEHÅLL – ändra text, tider och namn här.
   Utseende och logik ligger i ../telefon.css och ../telefon.js.

   from:   samma bokstav som "me" = telefonens ägare (grön bubbla till höger)
   date, time, listWhen: valfria – utelämnas de visas ingen tid.
   open:   vilken app som öppnas. Saknas open skakar ikonen bara.
   memos:  röstmemon i appen Röstmemon, nyast först.
   ===================================================================== */
window.PHONE = {
  owner: "Alex", me: "A",

  time: "01:52",                       // klockan i statusraden

  threads: [
    { name: "Nora ❤️", listWhen: "Igår", days: [{ date: "13 juni", msgs: [
